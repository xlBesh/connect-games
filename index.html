<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f1117"
  >

  <meta
    name="description"
    content="Connect 4 and Connect 5 with AI and position analysis."
  >

  <title>Connect Games</title>

  <!-- PWA -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >

  <!-- STYLE -->
  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <main class="app">

    <h1>Connect Games</h1>


    <!-- GAME SELECTOR -->
    <div class="game-switch">

      <button
        id="connect4Btn"
        class="game-switch-btn active"
        type="button"
      >
        Connect 4
      </button>

      <button
        id="connect5Btn"
        class="game-switch-btn"
        type="button"
      >
        Connect 5
      </button>

    </div>


    <!-- GAME -->
    <section
      id="gameArea"
      class="game-area game-connect4"
    >


      <!-- AI CONTROLS -->
      <div class="players">

        <label>
          <input
            type="checkbox"
            id="aiA"
          >
          AI for Player A 🔴
        </label>

        <label>
          <input
            type="checkbox"
            id="aiB"
          >
          AI for Player B 🟡
        </label>

      </div>


      <!-- TURN -->
      <p id="turn">
        Turn: Player A 🔴
      </p>


      <!-- HISTORY CONTROLS -->
      <div class="controls">

        <button
          id="undo"
          type="button"
        >
          ↶ Undo
        </button>

        <button
          id="redo"
          type="button"
        >
          ↷ Redo
        </button>

        <button
          id="restart"
          type="button"
        >
          ⟳ Restart
        </button>

      </div>


      <!-- SOLVER -->
      <div class="solver-panel">

        <h3>
          🧠 Solver
        </h3>


        <div class="solver-options">

          <label for="thinkTime">
            Thinking time
          </label>

          <select id="thinkTime">

            <option value="300">
              0.3 sec
            </option>

            <option
              value="700"
              selected
            >
              0.7 sec
            </option>

            <option value="1500">
              1.5 sec
            </option>

            <option value="3000">
              3 sec
            </option>

          </select>

        </div>


        <p id="solverStatus">
          Ready
        </p>

      </div>


      <!-- ANALYSIS + BOARD -->
      <div class="analysis-wrap">

        <div
          id="analysis"
          class="analysis"
        ></div>

        <div
          id="board"
          aria-label="Connect game board"
        ></div>

        <div
          id="columnNumbers"
          class="column-numbers"
        ></div>

      </div>


      <!-- SOLVER LEGEND -->
      <p class="legend">
        W = forced win ·
        D = forced draw ·
        L = forced loss ·
        ? = not proven
      </p>


    </section>


    <!-- VERSION -->
    <p class="version">
      v1.5
    </p>

  </main>


  <!-- GAME ENGINES -->
  <script src="connect4.js"></script>
  <script src="connect5.js"></script>

  <!-- SHARED INTERFACE -->
  <script src="script.js"></script>


  <!-- SERVICE WORKER -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .catch(error => {
              console.error(
                "Service Worker registration failed:",
                error
              );
            });
        }
      );
    }
  </script>

</body>

</html>
